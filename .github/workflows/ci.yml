name: Pull request validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-browser-test:
    # Match the release reproduction environment; review OS upgrades explicitly.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run verification suite
        run: npm test -- --reporter=default --reporter=json --outputFile=test-results.json
      - name: Check the README test-count claim
        run: node scripts/check-test-count.mjs
      - name: Check documentation links
        run: npm run check:docs
      - name: Check dependency advisories
        run: npm run check:security
      - name: Build production application
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        run: npm run test:e2e
      - name: Save failed verification reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports-${{ github.job }}-${{ github.run_attempt }}
          path: |
            web/test-results.json
            web/playwright-report/
            web/test-results/
          retention-days: 14
          if-no-files-found: ignore
