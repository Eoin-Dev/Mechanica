name: Deploy Mechanica to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run physics verification suite
        run: npm test -- --reporter=default --reporter=json --outputFile=test-results.json
      # The README badge states a lower bound rather than an exact count, so
      # it needs no commit when a test is added - but it does need something
      # to notice if the suite ever shrinks past what it claims. The exact
      # figure only exists here, in the run that just produced it.
      - name: Check the README test-count claim
        run: node scripts/check-test-count.mjs
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
